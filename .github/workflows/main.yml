
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -o PoolAimHelper_Source.zip -d project

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          gradle -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PoolAimHelper-APK
          path: project/**/build/outputs/apk/debug/*.apk
